[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satenhance-acquire"
version = "0.1.0"
description = "SatEnhance System 1: resolve an AOI and download Sentinel-2 data"
requires-python = ">=3.11"
dependencies = [
  "satenhance-common",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pystac-client>=0.8",
  "requests>=2.31",
  "typer>=0.12",
  "tenacity>=8.2",
  "boto3>=1.34",  # rasterio reads S3 credentials only through boto3
  "numpy>=1.26",
]

[project.scripts]
satenhance-acquire = "satenhance_acquire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["satenhance_acquire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real CDSE credentials and network (opt-in)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::PendingDeprecationWarning", "ignore::DeprecationWarning"]
