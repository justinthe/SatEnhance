name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check .

  test-acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e common -e acquire pytest responses
      - run: pytest common acquire/tests tests/shell -q

  test-enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # torch and torchvision from the same index (timm needs torchvision) so pip never swaps torch
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      # deliberately NOT installing acquire: System 2 must work with its own dependencies only
      - run: pip install -e common -e enhance pytest
      - run: pytest enhance/tests -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/smoke/test_pipeline_smoke.sh

  gpu-dockerfile-check:
    # The GPU image is only lint-checked in CI (no GPU runners, and the mamba-ssm build is slow).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --check -f enhance/Dockerfile.gpu .
